name: Build and deploy

# Hardening, deliberate and worth keeping:
#  - Third-party actions are pinned to COMMIT SHAs, not tags. A tag can be moved
#    by whoever owns the action; a SHA cannot.
#  - Default token permissions are read-only, granted per job.
#  - Deploy runs on push to main only. Never on pull_request_target, which is the
#    trigger that would hand a fork's code access to the secret.
#  - The Cloudflare token lives in a protected environment, scoped to
#    Workers Scripts:Edit and nothing else.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Guard - originals must never reach the build output
        run: |
          # PROJECT.md rule 2: the repo carries ~2400px web masters only.
          # A full-resolution original in dist/ means one leaked into src/.
          if find dist -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -size +2M | grep -q .; then
            echo "::error::An image over 2MB reached dist/. Originals belong in private storage, not this repo."
            find dist -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -size +2M
            exit 1
          fi
          echo "No oversized images in dist/."

      - name: Upload build
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    # Two conditions, both deliberate:
    #  - Never on pull_request: a fork must not be able to reach the token.
    #  - Gated on a repo variable rather than on the secret existing, because a
    #    missing secret fails the job red and a portfolio repo's green CI is part
    #    of what it is demonstrating. Set DEPLOY_ENABLED=true once
    #    CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are in place; until then
    #    this skips cleanly and the build still proves itself on every push.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist

      # STAGING IS THE DEFAULT, and that is the whole point of this step.
      #
      # deploy/wrangler.jsonc names the worker `plain-block-545a`, which is the
      # one the live domain is bound to. So a bare `wrangler deploy` publishes
      # straight over the real site. Until this step existed, turning
      # DEPLOY_ENABLED on for the first time would have replaced the portfolio
      # with a noindex placeholder, which is the exact opposite of the recorded
      # decision that B2 deploys to staging.
      #
      # Production now requires DEPLOY_TARGET=production, set deliberately and
      # separately from DEPLOY_ENABLED. Anything else, including unset, is
      # staging. Two variables have to be right before the live site can move.
      - name: Resolve deploy target
        id: target
        run: |
          set -euo pipefail
          if [ "${{ vars.DEPLOY_TARGET }}" = "production" ]; then
            echo "mode=production"                     >> "$GITHUB_OUTPUT"
            echo "args="                               >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.SITE_URL || 'https://shaheenkiarash.com' }}" >> "$GITHUB_OUTPUT"
          else
            name="${{ vars.STAGING_WORKER_NAME || 'shaheenkiarash-staging' }}"
            echo "mode=staging"                        >> "$GITHUB_OUTPUT"
            echo "args=--name $name"                   >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.STAGING_URL }}"         >> "$GITHUB_OUTPUT"
            echo "Deploying to STAGING worker '$name'. Set DEPLOY_TARGET=production to publish live."
          fi

      # Refuse to overwrite the live site with a page that tells search engines
      # to forget it. The placeholder carries `noindex` until the build phase
      # removes it, so this guard is what makes "production" safe to enable at
      # the moment someone is confident enough to set the variable.
      - name: Guard - never publish a noindex build to production
        if: steps.target.outputs.mode == 'production'
        run: |
          set -euo pipefail
          if grep -rqi 'name="robots"[^>]*noindex' dist/index.html; then
            echo "::error::Refusing production deploy: dist/index.html still carries noindex. Remove it in the build phase first."
            exit 1
          fi
          echo "No noindex in the production build."

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config deploy/wrangler.jsonc ${{ steps.target.outputs.args }}

      # A skipped check must say so out loud. Silence here would read as "the
      # smoke checks passed" when nothing ran at all.
      - name: Note when smoke checks cannot run
        if: steps.target.outputs.url == ''
        run: |
          echo "::warning::Deployed to ${{ steps.target.outputs.mode }} but STAGING_URL is not set, so NO post-deploy checks ran. Set the STAGING_URL repo variable to the worker's URL to enable them."

      - name: Verify the deploy, because "it uploaded" is not "it works"
        if: steps.target.outputs.url != ''
        env:
          SITE: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          echo "Verifying $SITE"

          # 1. Homepage is live and is actually what we just built.
          live=$(curl -fsS "$SITE/")
          echo "$live" | grep -q "<html" || { echo "::error::Homepage did not return HTML"; exit 1; }

          # 2. A path that must 404 still 404s. Guards against a fallback
          #    silently serving the homepage for everything.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/digitals")
          [ "$code" = "404" ] || { echo "::error::/digitals returned $code, expected 404"; exit 1; }

          # 3. The redirect map is actually in force.
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' "$SITE/now")
          case "$loc" in
            */about) : ;;
            *) echo "::error::/now redirected to '$loc', expected /about"; exit 1 ;;
          esac

          # 4. The share card exists. A missing og:image is invisible until
          #    someone pastes the link somewhere and it looks broken.
          echo "$live" | grep -qi 'property="og:image"' || { echo "::error::og:image missing"; exit 1; }

          echo "All post-deploy checks passed."
